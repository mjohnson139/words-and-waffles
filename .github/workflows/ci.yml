name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # App: typecheck, lint, unit tests, web export, bundle budget.
      # Worker: typecheck, lint, tests, dry-run deploy.
      - run: npm run verify
