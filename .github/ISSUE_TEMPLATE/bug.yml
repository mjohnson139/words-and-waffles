name: Bug
description: Something is wrong
title: "fix: "
labels: [fix]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or date
