name = "words-and-waffles"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[observability]
enabled = false

# The database_id is the one printed by `npx wrangler d1 create words-and-waffles`
# (deploy step 1). It is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "words-and-waffles"
database_id = "7149c9c0-cd75-4769-8924-c73b99525a92"
migrations_dir = "migrations"

# WORD_SECRET is a secret: `npx wrangler secret put WORD_SECRET`. Never put it here.
